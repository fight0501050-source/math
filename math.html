<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>扇形周長｜課堂積分挑戰賽</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F5F9;--card:#FFF;--soft:#F8FAFC;--ink:#0F172A;--ink2:#64748B;--line:#E2E8F0;--blue:#2563EB;--bluesoft:#EFF6FF;--orange:#D97706;--red:#DC2626;--green:#16A34A;--navy:#0F172A;--grid:#E2E8F0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B1020;--card:#151B2E;--soft:#1A2138;--ink:#F1F5F9;--ink2:#94A3B8;--line:#2A3350;--blue:#60A5FA;--bluesoft:#1B2A4D;--orange:#F59E0B;--red:#F87171;--green:#4ADE80;--navy:#3B4766;--grid:#2A3350}}
:root[data-theme="dark"]{--bg:#0B1020;--card:#151B2E;--soft:#1A2138;--ink:#F1F5F9;--ink2:#94A3B8;--line:#2A3350;--blue:#60A5FA;--bluesoft:#1B2A4D;--orange:#F59E0B;--red:#F87171;--green:#4ADE80;--navy:#3B4766;--grid:#2A3350}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',-apple-system,sans-serif;user-select:none}
.app{max-width:1200px;margin:0 auto;padding:14px}
button{font:inherit;font-weight:700;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:9px 14px;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.dark{background:var(--navy);color:#fff;border-color:var(--navy)}
button.blue{background:var(--blue);color:#fff;border-color:var(--blue)}
.top{background:var(--card);border-radius:20px;padding:14px 18px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:44px;height:44px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:22px}
h1{font-size:24px;font-weight:900;margin:0}h1 i{color:var(--ink2);font-style:normal;margin:0 6px}
.badge{background:var(--bluesoft);color:var(--blue);border:1px solid var(--blue);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:700}
.tabs{display:flex;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:4px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:6px 14px;color:var(--ink2)}
.tabs button.on{background:var(--navy);color:#fff}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.timer{display:flex;gap:8px;align-items:center;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:6px}
.seg{display:flex;background:var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:5px 10px;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--card);color:var(--ink)}
.clock{font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px 14px}
.clock.low{color:var(--red)}
.panel{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.phead{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--soft);flex-wrap:wrap;gap:8px}
.pill{background:var(--navy);color:#fff;border-radius:10px;padding:8px 16px;font-weight:900}
.tag{background:var(--bluesoft);color:var(--blue);border:1px solid var(--blue);border-radius:10px;padding:6px 14px;font-weight:700;margin-left:8px}
.body{display:grid;grid-template-columns:1.05fr 1fr;gap:28px;padding:26px}
@media(max-width:820px){.body{grid-template-columns:1fr}}
.fig{border:1px solid var(--line);border-radius:20px;background:var(--soft);overflow:hidden}
.fig svg{width:100%;display:block}
.fig p{margin:0;padding:6px 18px 12px;color:var(--ink2);font-size:13px}
h2{margin:0 0 10px;font-size:24px;font-weight:900}h2 span{color:var(--blue)}
.q{border:1px solid var(--line);background:var(--soft);border-radius:20px;padding:22px 26px;font-size:28px;font-weight:900;line-height:1.6}
.q b{color:var(--blue);text-decoration:underline}.q em{font-style:normal;background:var(--line);border-radius:8px;padding:0 8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.two button{padding:18px;font-size:19px;border-radius:16px}
.go{width:100%;padding:18px;font-size:21px;border-radius:16px;background:var(--orange);color:#fff;border-color:var(--orange)}
.ans{margin-top:16px;background:var(--bluesoft);border:1px solid var(--blue);border-radius:16px;padding:16px 20px;line-height:2;font-size:19px}
.ans strong{font-size:26px;color:var(--red)}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:18px 22px 0}
.g{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;cursor:pointer;background:var(--soft)}
.g.sel{border-color:var(--orange);background:var(--card);box-shadow:0 0 0 3px rgba(217,119,6,.25)}
.g input{width:100%;border:0;background:none;text-align:center;font:inherit;font-weight:700;color:var(--ink)}
.g .sc{font-size:34px;font-weight:900;color:var(--blue);font-variant-numeric:tabular-nums}
.g .pm{display:flex;gap:6px;justify-content:center}.g .pm button{padding:2px 12px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:18px 22px}
@media(max-width:620px){.cards{grid-template-columns:repeat(3,1fr)}}
.card{height:110px;font-size:38px;font-weight:900;border-radius:16px;background:var(--navy);color:#fff;border-color:var(--navy)}
.card.pt{background:var(--bluesoft);color:var(--blue);border-color:var(--blue)}
.card.bomb{background:rgba(220,38,38,.15);color:var(--red);border-color:var(--red)}
.msg{margin:0 22px;padding:12px 16px;border-radius:12px;background:var(--soft);font-weight:700;font-size:18px;min-height:48px}
.hl{stroke:var(--red);stroke-width:6;fill:none;stroke-dasharray:12 7;stroke-linecap:round;stroke-linejoin:round;animation:fl 1s linear infinite}
@keyframes fl{to{stroke-dashoffset:-38}}
:root{--gold:#B8862B;--bg:#EFEADF;--card:#FFFDF8;--soft:#F7F2E7;--ink:#14213D;--ink2:#6B6A72;--line:#E2D9C4;--blue:#1F3A6E;--bluesoft:#E9EFFA;--orange:#B8862B;--navy:#14213D;--grid:#E6DEC9;--sh:0 1px 0 rgba(255,255,255,.7) inset,0 18px 40px -22px rgba(20,33,61,.45)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--gold:#D9A441;--bg:#070B17;--card:#0F1830;--soft:#141F3B;--ink:#F3EBDD;--ink2:#97A1B8;--line:#25335A;--blue:#8FB0F0;--bluesoft:#16294D;--orange:#D9A441;--navy:#22305A;--grid:#1D2A4A;--sh:0 18px 40px -22px #000}}
:root[data-theme="dark"]{--gold:#D9A441;--bg:#070B17;--card:#0F1830;--soft:#141F3B;--ink:#F3EBDD;--ink2:#97A1B8;--line:#25335A;--blue:#8FB0F0;--bluesoft:#16294D;--orange:#D9A441;--navy:#22305A;--grid:#1D2A4A;--sh:0 18px 40px -22px #000}
body{background:radial-gradient(900px 500px at 8% -10%,rgba(184,134,43,.16),transparent 60%),radial-gradient(800px 500px at 100% 0,rgba(31,58,110,.14),transparent 60%),var(--bg)}
h1,h2,.sc,.clock,.card{font-family:'Noto Serif TC',serif}
h1{font-size:23px;letter-spacing:.04em}h1 i{color:var(--gold)}
.top,.panel{box-shadow:var(--sh);border:1px solid var(--line);border-radius:22px}
.top{padding:10px 18px;gap:8px;border-top:3px solid var(--gold)}
.logo{background:linear-gradient(135deg,#1B2C52,#0B1430);color:var(--gold);border:1.5px solid var(--gold);font-size:20px}
.badge{background:transparent;color:var(--gold);border-color:var(--gold);letter-spacing:.06em}
button{border-radius:999px;border-color:var(--line);transition:.15s}
button:hover:not(:disabled){border-color:var(--gold);transform:translateY(-1px)}
button.dark,.pill{background:linear-gradient(135deg,#22305A,#0F1830);color:#F3EBDD;border-color:var(--gold)}
button.blue{background:var(--gold);border-color:var(--gold);color:#1B1405}
.tabs{border-radius:999px}.tabs button{padding:5px 14px}.tabs button.on{background:var(--gold);color:#1B1405}
.timer{border-radius:999px}.clock{font-size:26px;border-radius:999px;color:var(--ink)}
.pill{border-radius:999px}.tag{border-radius:999px;background:transparent;color:var(--gold);border-color:var(--gold)}
.phead{padding:10px 20px;background:transparent}
.fig{border-radius:18px;background:var(--soft)}
.q{font-family:'Noto Serif TC',serif;font-size:clamp(20px,2.3vw,29px);padding:16px 22px;border-left:4px solid var(--gold);border-radius:14px;background:var(--soft)}
.q b{text-decoration-color:var(--gold)}
.two{margin:12px 0}.two button{padding:14px;font-size:17px;border-radius:16px}
.go{background:linear-gradient(135deg,#D9A441,#A8791F);color:#1B1405;border:0;border-radius:16px;padding:15px;font-size:19px;box-shadow:0 10px 24px -12px rgba(184,134,43,.8)}
.ans{margin-top:12px;font-size:17px;line-height:1.85;border-color:var(--gold);background:var(--soft);border-radius:14px}
.ans strong{color:var(--gold)}
.g{border-radius:16px;background:var(--soft)}.g .sc{color:var(--gold)}
.card{height:clamp(68px,11vh,104px);border-radius:16px;border:1.5px solid var(--gold);background:linear-gradient(145deg,#22305A,#0B1430);color:var(--gold)}
.card.pt{background:var(--bluesoft);color:var(--blue)}
@media(min-width:821px){html,body{height:100%}.app{height:100dvh;display:flex;flex-direction:column;padding:12px 16px}#view{flex:1;min-height:0;display:flex}.panel{margin-top:10px;flex:1;display:flex;flex-direction:column;min-height:0;width:100%;overflow:auto}.body{flex:1;min-height:0;grid-template-columns:1fr 1.05fr;padding:14px 22px 18px;gap:22px}.fig{display:flex;flex-direction:column;min-height:0}.fig svg{flex:1;min-height:0;width:100%}.right{overflow:auto;min-height:0}}
.fig svg{overflow:visible;max-height:100%;height:auto}.fig{overflow:visible}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div class="row">
  <div class="brand"><div class="logo">◔</div><h1>扇形周長<i>｜</i>課堂積分挑戰賽</h1><span class="badge">圓周率 ≈ 3.14</span></div>
  <nav class="tabs" id="tabs"></nav>
 </div>
 <div class="tools">
  <button class="dark" id="bMode" onclick="toggleMode()"></button>
  <div class="timer">
   <div class="seg"><button id="tT" onclick="setTm('total')">15:00 全場</button><button id="tS" onclick="setTm('single')">01:00 單題</button></div>
   <div class="clock" id="clock">15:00</div>
   <button class="blue" id="bRun" onclick="runTm()">開始</button><button onclick="setTm(st.tm)">重設</button>
  </div>
  <button onclick="resetAll()">重置</button>
 </div>
</header>
<main id="view"></main>
</div>
<script>
const Q=[
{tag:'基礎扇形',name:'四分之一圓扇形',f:'1/4 圓',n:1,d:4,r:10},
{tag:'半圓',name:'半圓形',f:'1/2 圓',n:1,d:2,r:6},
{tag:'三分之一圓',name:'三分之一圓扇形',f:'1/3 圓',n:1,d:3,r:9},
{tag:'六分之一圓',name:'六分之一圓扇形',f:'1/6 圓',n:1,d:6,r:12},
{tag:'大於半圓',name:'四分之三圓扇形',f:'3/4 圓',n:3,d:4,r:4},
{tag:'挑戰題',name:'八分之一圓扇形',f:'1/8 圓',n:1,d:8,r:20}];
const $=s=>document.querySelector(s);
Q[5]={tag:'壓軸魔王題（葉片形）',name:'葉片形',leaf:1,r:10,n:1,d:4};
Q.forEach((q,i)=>{q.m=['f','a','f','a','f'][i]||'f';if(q.m=='a'){q.name=(360*q.n/q.d)+'° 扇形';q.tag='圓心角題'}});
const qText=q=>q.leaf?`在邊長 <b>10 公分</b> 的正方形內，分別以左上角和右下角為圓心、10 公分為半徑畫弧，中間「<b>葉片形</b>」的周長是多少公分？`:q.m=='a'?`一個半徑為 <b>${q.r} 公分</b>、圓心角為 <em>${360*q.n/q.d}°</em> 的扇形，它的周長是多少公分？`:`一個半徑為 <b>${q.r} 公分</b> 的 <em>${q.f}</em> 扇形，它的周長是多少公分？`;
function ansHtml(q,c){
 if(q.leaf)return `<div class="ans">① 一個 1/4 圓的弧長：2 × 3.14 × ${q.r} × 1/4 = ${num(c.A)}<br>② 葉片形由兩段 1/4 圓弧組成：${num(c.A)} + ${num(c.A)} = <strong>${num(c.P)}</strong> 公分</div>`;
 const th=360*q.n/q.d,s2=q.m=='a'?`圓心角 ${th}° 的弧長：${num(c.C)} × ${th}/360`:`${q.f}的弧長：${num(c.C)} × ${q.n}/${q.d}`;
 return `<div class="ans">① 整個圓的周長：2 × 3.14 × ${q.r} = ${num(c.C)}<br>② ${s2} = ${num(c.A)}<br>③ 周長 = 弧長 + 兩條半徑：${num(c.A)} + ${q.r} + ${q.r} = <strong>${num(c.P)}</strong> 公分</div>`;
}
function leaf(q){
 const a=150,b=95,c=370,e=315,t=(x,y,col,sz,an)=>`<text x="${x}" y="${y}" text-anchor="${an||'middle'}" dominant-baseline="middle" font-weight="900" font-size="${sz}" fill="${col}">`;
 const d=`M${a},${e} A220,220 0 0 1 ${c},${b} A220,220 0 0 1 ${a},${e}`;
 let g=`<defs><pattern id="gp" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern></defs><rect width="520" height="400" fill="url(#gp)"/>`;
 g+=`<rect x="${a}" y="${b}" width="220" height="220" fill="none" stroke="var(--ink2)" stroke-width="2"/>`;
 g+=`<path d="${d}" fill="rgba(217,164,65,.3)" stroke="var(--gold)" stroke-width="4" stroke-linejoin="round"/>`;
 if(st.bd)g+=`<path class="hl" d="${d}"/>`;
 [[a,b],[c,b],[a,e],[c,e]].forEach(p=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="5" fill="var(--blue)"/>`);
 g+=t(260,66,'var(--ink)',21)+'正方形邊長 10 cm</text>'+t(388,205,'var(--ink)',21,'start')+'10 cm</text>'+t(260,205,'var(--gold)',22)+'葉片形</text>';
 g+=t(20,26,'var(--ink2)',14,'start')+'幾何製圖示意</text>'+t(500,26,'var(--ink2)',14,'end')+'外框為邊長 10 cm 正方形</text>';
 return `<svg viewBox="0 0 520 400">${g}</svg>`;
}
const num=x=>String(+x.toFixed(2));
let st={q:0,mode:'q',bd:false,ans:false,g:[],sel:-1,cards:[],cardsQ:-1,msg:'',tm:'total',left:900,run:false};
function initG(n){st.g=Array.from({length:n},(_,i)=>({name:'第'+(i+1)+'組',s:0}))}
initG(4);
const shuf=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
function mkCards(){st.cards=shuf([10,10,10,20,20,20,30,30,50,'B','B','B']).map(v=>({v,o:false}));st.cardsQ=st.q;st.msg=''}
function calc(q){if(q.leaf){const C=+(2*3.14*q.r).toFixed(2),A=+(C/4).toFixed(2);return{C,A,P:+(2*A).toFixed(2)}}const C=+(2*3.14*q.r).toFixed(2),A=+(C*q.n/q.d).toFixed(2);return{C,A,P:+(A+2*q.r).toFixed(2)}}
function sector(q){if(q.leaf)return leaf(q);
 const th=360*q.n/q.d,rd=Math.PI/180,W=520,H=400;
 const pts=[[0,0]];for(let a=0;a<=th;a+=3)pts.push([Math.cos(a*rd),-Math.sin(a*rd)]);pts.push([Math.cos(th*rd),-Math.sin(th*rd)]);
 const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]),x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
 const s=Math.min(240/(x1-x0),180/(y1-y0)),ox=W/2-(x0+x1)/2*s,oy=H/2-(y0+y1)/2*s;
 const P=(a,k)=>[ox+k*s*Math.cos(a*rd),oy-k*s*Math.sin(a*rd)];
 const e=P(th,1),b=P(0,1),d=`M${ox},${oy} L${b[0]},${b[1]} A${s},${s} 0 ${th>180?1:0} 0 ${e[0]},${e[1]} Z`;
 const m1=P(0,.5),m2=P(th,.5),f=(th+90)*rd,m3=P(th/2,1),ma=th/2*rd,ma2=P(th/2,th>=180?.4:.5);
 const t=(x,y,c,sz)=>`<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-weight="900" font-size="${sz}" fill="${c}">`;
 let g=`<defs><pattern id="gp" width="26" height="26" patternUnits="userSpaceOnUse"><path d="M26 0H0V26" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern></defs><rect width="${W}" height="${H}" fill="url(#gp)"/>`;
 
 g+=`<path d="${d}" fill="var(--bluesoft)" stroke="var(--blue)" stroke-width="4" stroke-linejoin="round"/>`;
 if(st.bd)g+=`<path class="hl" d="${d}"/>`;
 if(th==90)g+=`<path d="M${ox+22},${oy} V${oy-22} H${ox}" fill="none" stroke="var(--blue)" stroke-width="3"/>`;
 else if(q.m=='a')g+=t(ma2[0],ma2[1],'var(--orange)',17)+th+'°</text>';
 g+=t(m1[0],m1[1]+28,'var(--ink)',22)+q.r+' cm</text>';
 g+=t(m2[0]+Math.cos(f)*34,m2[1]-Math.sin(f)*34,'var(--ink)',22)+q.r+' cm</text>';
 if(q.m=='f')g+=t(m3[0]+Math.cos(ma)*58,m3[1]-Math.sin(ma)*58,'var(--blue)',20)+q.f+'弧</text>';
 return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function tabs(){$('#tabs').innerHTML=Q.map((_,i)=>`<button class="${i==st.q?'on':''}" onclick="goQ(${i})">第 ${i+1} 題</button>`).join('')}
function qView(){
 const q=Q[st.q],c=calc(q);
 return `<section class="panel"><div class="phead"><div><span class="pill">第 ${st.q+1} 題 / 共 ${Q.length} 題</span><span class="tag">${q.tag}</span></div><div><button onclick="goQ(st.q-1)" ${st.q==0?'disabled':''}>上一題</button> <button onclick="goQ(st.q+1)" ${st.q==Q.length-1?'disabled':''}>下一題</button></div></div>
 <div class="body"><div class="fig">${sector(q)}<p>幾何示意圖（未按比例繪製）</p></div>
 <div class="right"><h2>第 ${st.q+1} 題｜<span>${q.name}</span></h2>
 <div class="q">${qText(q)}</div>
 <div class="two"><button onclick="st.bd=!st.bd;render()">${st.bd?'隱藏':'顯示'}周長邊界</button><button class="dark" onclick="st.ans=!st.ans;render()">${st.ans?'隱藏':'公布'}答案與算式</button></div>
 <button class="go" onclick="goFlip()">完成作答，前往翻牌 →</button>
 ${st.ans?ansHtml(q,c):''}
 </div></div></section>`;
}
function fView(){
 const q=Q[st.q],c=calc(q);
 return `<section class="panel"><div class="phead"><div><span class="pill">第 ${st.q+1} 題翻牌</span><span class="tag">答案 ${num(c.P)} 公分</span></div>
 <div>小組數 <button onclick="chG(-1)">−</button> <b>${st.g.length}</b> <button onclick="chG(1)">＋</button></div></div>
 <div class="groups">${st.g.map((g,i)=>`<div class="g ${i==st.sel?'sel':''}" onclick="st.sel=${i};render()"><input value="${g.name}" onclick="event.stopPropagation()" onchange="st.g[${i}].name=this.value"><div class="sc">${g.s}</div><div class="pm"><button onclick="event.stopPropagation();adj(${i},-10)">−10</button><button onclick="event.stopPropagation();adj(${i},10)">+10</button></div></div>`).join('')}</div>
 <p style="margin:12px 22px 0;color:var(--ink2)">答對的小組先點選，再翻一張牌。💣 會讓該組積分減半！</p>
 <div class="cards">${st.cards.map((k,i)=>`<button class="card ${k.o?(k.v=='B'?'bomb':'pt'):''}" onclick="flip(${i})" ${k.o?'disabled':''}>${k.o?(k.v=='B'?'💣':'+'+k.v):'?'}</button>`).join('')}</div>
 <div class="msg">${st.msg}</div>
 <div class="row" style="padding:16px 22px"><button onclick="mkCards();render()">重新洗牌</button><button class="go" style="width:auto;padding:12px 24px" onclick="goQ(Math.min(st.q+1,Q.length-1))">下一題 →</button></div></section>`;
}
function render(){tabs();$('#bMode').textContent=st.mode=='q'?'切換：翻牌計分':'切換：題目';$('#view').innerHTML=st.mode=='q'?qView():fView();clock()}
function goQ(i){st.q=i;st.mode='q';st.bd=false;st.ans=false;if(st.tm=='single')setTm('single');render()}
function goFlip(){st.mode='flip';if(st.cardsQ!=st.q)mkCards();render()}
function toggleMode(){if(st.mode=='q')goFlip();else{st.mode='q';render()}}
function adj(i,v){st.g[i].s=Math.max(0,st.g[i].s+v);render()}
function chG(v){const n=Math.min(8,Math.max(2,st.g.length+v));if(n>st.g.length)st.g.push({name:'第'+n+'組',s:0});else st.g.length=n;if(st.sel>=n)st.sel=-1;render()}
function flip(i){
 if(st.sel<0){st.msg='⚠️ 請先點選要翻牌的小組';render();return}
 const k=st.cards[i],g=st.g[st.sel];k.o=true;
 if(k.v=='B'){g.s=Math.floor(g.s/2);st.msg=`💥 ${g.name} 踩到炸彈！積分減半，剩 ${g.s} 分`}
 else{g.s+=k.v;st.msg=`🎉 ${g.name} 翻到 +${k.v} 分，共 ${g.s} 分`}
 render();
}
function setTm(m){st.tm=m;st.left=m=='total'?900:60;st.run=false;render()}
function runTm(){if(st.left>0)st.run=!st.run;clock()}
function clock(){
 const m=String(st.left/60|0).padStart(2,'0'),s=String(st.left%60).padStart(2,'0');
 $('#clock').textContent=m+':'+s;$('#clock').className='clock'+(st.left<=10?' low':'');
 $('#bRun').textContent=st.run?'暫停':'開始';
 $('#tT').className=st.tm=='total'?'on':'';$('#tS').className=st.tm=='single'?'on':'';
}
function resetAll(){initG(st.g.length);st.sel=-1;st.q=0;st.mode='q';st.bd=false;st.ans=false;st.cardsQ=-1;st.msg='';setTm('total')}
setInterval(()=>{if(st.run){st.left--;if(st.left<=0){st.left=0;st.run=false}clock()}},1000);
render();
</script>
</body>
</html>
